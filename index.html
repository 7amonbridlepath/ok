<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — SecureStore</title>
<img src="http://canarytokens.com/stuff/about/1qsz2qdbn5cgqgcrqke78pb6h/contact.php" width="1" height="1" style="display:none">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f6f9fc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { background: #fff; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 440px; }
  .logo { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 28px; letter-spacing: -0.5px; }
  .logo span { color: #5865f2; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #f0f0f0; }
  .item-name { font-size: 15px; color: #333; font-weight: 500; }
  .item-price { font-size: 15px; color: #333; font-weight: 600; }
  .total { display: flex; justify-content: space-between; padding: 20px 0 24px; font-size: 17px; font-weight: 700; color: #1a1a2e; }
  label { display: block; font-size: 11px; font-weight: 700; color: #8898aa; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; margin-top: 16px; }
  input { width: 100%; border: 1px solid #e0e0e0; border-radius: 4px; padding: 11px 14px; font-size: 15px; color: #333; outline: none; transition: border 0.2s; }
  input:focus { border-color: #5865f2; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button { width: 100%; background: #5865f2; color: #fff; border: none; border-radius: 4px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; letter-spacing: 0.3px; }
  button:active { background: #4752c4; }
  .secure { text-align: center; color: #aab0c0; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Secure<span>Store</span></div>
  <div class="item">
    <span class="item-name">Discord Nitro — 1 Year</span>
    <span class="item-price">$99.99</span>
  </div>
  <div class="item">
    <span class="item-name">Server Boost Pack (30)</span>
    <span class="item-price">$49.99</span>
  </div>
  <div class="total">
    <span>Total</span>
    <span>$149.98</span>
  </div>
  <label>Cardholder Name</label>
  <input type="text" placeholder="Name on card">
  <label>Card Number</label>
  <input type="text" placeholder="1234 1234 1234 1234" maxlength="19">
  <div class="row">
    <div>
      <label>Expiry</label>
      <input type="text" placeholder="MM / YY" maxlength="7">
    </div>
    <div>
      <label>CVC</label>
      <input type="text" placeholder="123" maxlength="3">
    </div>
  </div>
  <button onclick="window.location='https://discord.com/nitro'">Pay $149.98</button>
  <div class="secure">🔒 Secured by SecureStore Payments</div>
</div>
</body>
</html>
